# uQbit's page in uQ Settings (Apps > Torrents). Installed to
# /usr/share/uq/settings/pages/uqbit/ by the uqbit package; inert without uQ.
# Reference: docs/settings-pages.md in the uQ repository. Every read and change is a `uqbit`
# command (see `uqbit --help`); nothing here runs as root.
uq_api = 2
id = "uqbit"
name = "Torrents"
icon = "io.github.asafelobotomy.uqbit"
qml = "Page.qml"
keywords = ["uqbit", "torrent", "torrents", "magnet", "qbittorrent", "bittorrent", "seeding", "downloads", "p2p"]

[[setting]]
id = "default"
label = "Open torrents with uQbit"
keywords = ["default", "open with", "magnet links", ".torrent", "qbittorrent", "file types"]

[[setting]]
id = "engine"
label = "Torrent engine"
keywords = ["qbittorrent-nox", "engine", "daemon", "background", "start", "stop", "running"]

[[setting]]
id = "keep_running"
label = "Keep seeding after closing"
keywords = ["background", "seeding", "close", "quit", "tray"]

[[setting]]
id = "start_on_login"
label = "Start on login"
keywords = ["autostart", "login", "boot", "systemd", "background"]

[[setting]]
id = "launch_on_login"
label = "Open uQbit when you log in"
keywords = ["startup", "autostart", "login", "boot", "run on startup", "launch"]

[[setting]]
id = "start_in_tray"
label = "Start in the tray"
keywords = ["tray", "minimised", "hidden", "startup", "background", "system tray"]

[[setting]]
id = "close_to_tray"
label = "Close to the tray"
keywords = ["tray", "close", "exit", "background", "system tray", "keep running"]

[[setting]]
id = "minimize_to_tray"
label = "Minimise to the tray"
keywords = ["tray", "minimise", "minimize", "hide", "system tray"]

[[setting]]
id = "download_folder"
label = "Download folder"
keywords = ["downloads", "save path", "folder", "location"]

[[setting]]
id = "ask_before_adding"
label = "Ask before adding"
keywords = ["add dialog", "confirm", "magnet", "choose folder"]

[[setting]]
id = "start_added"
label = "Start new torrents right away"
keywords = ["paused", "stopped", "start", "add"]

[[setting]]
id = "notify_finished"
label = "Notify when a download finishes"
keywords = ["notification", "done", "complete", "finished"]

[[setting]]
id = "download_limit"
label = "Download limit"
keywords = ["speed", "bandwidth", "throttle", "limit", "kib/s"]

[[setting]]
id = "upload_limit"
label = "Upload limit"
keywords = ["speed", "bandwidth", "throttle", "limit", "upload", "kib/s"]

[[setting]]
id = "seed_ratio"
label = "Stop seeding at ratio"
keywords = ["ratio", "share", "seeding", "upload", "stop"]

[[setting]]
id = "vpn_only"
label = "Send torrents only through the VPN"
keywords = ["vpn", "kill switch", "privacy", "leak", "wireguard", "openvpn", "proton", "interface", "bind"]

[[setting]]
id = "vpn_interface"
label = "VPN connection"
keywords = ["vpn", "interface", "wg0", "tun0", "network"]

[[setting]]
id = "encryption"
label = "Connect only to peers that encrypt"
keywords = ["encryption", "privacy", "isp", "throttling", "secure"]

[[setting]]
id = "anonymous_mode"
label = "Anonymous mode"
keywords = ["anonymous", "privacy", "fingerprint", "client id"]

[[setting]]
id = "blocklist"
label = "Block known monitoring peers"
keywords = ["blocklist", "ip filter", "peerblock", "anti-piracy", "privacy"]

[[setting]]
id = "incomplete_folder"
label = "Folder for unfinished downloads"
keywords = ["incomplete", "temp", "temporary", "unfinished", "partial", "folder", "move when finished"]

[[setting]]
id = "watch_folder"
label = "Watched folder"
keywords = ["watch", "scan", "auto add", "automatic", ".torrent", "folder", "monitor"]

[[setting]]
id = "content_layout"
label = "Put each torrent's files"
keywords = ["subfolder", "layout", "create folder", "content", "files"]

[[setting]]
id = "incomplete_extension"
label = "Mark unfinished files"
keywords = [".!qb", "extension", "incomplete", "unfinished", "partial"]

[[setting]]
id = "preallocate"
label = "Reserve disk space"
keywords = ["preallocate", "disk space", "allocate", "fragmentation"]

[[setting]]
id = "max_active_downloads"
label = "Downloads at once"
keywords = ["queue", "queueing", "active", "simultaneous", "concurrent", "at once", "limit"]

[[setting]]
id = "max_active_uploads"
label = "Seeding at once"
keywords = ["queue", "queueing", "active", "seeding", "upload", "at once"]

[[setting]]
id = "max_active_torrents"
label = "Torrents at once"
keywords = ["queue", "queueing", "active", "total", "at once"]

[[setting]]
id = "seed_time"
label = "Stop seeding after"
keywords = ["seeding time", "time limit", "minutes", "hours", "stop"]

[[setting]]
id = "when_seeded"
label = "When a torrent is done seeding"
keywords = ["remove", "stop", "finished", "ratio reached", "auto remove", "clean up"]

[[setting]]
id = "import_plugins"
label = "Use qBittorrent's search plugins"
keywords = ["search plugins", "qbit-plugin-dl", "nova3", "engines", "import", "qBittorrent plugins"]

[[setting]]
id = "tracker_lists"
label = "Tracker lists"
keywords = ["trackers", "tracker list", "trackerslist", "ngosang", "announce", "more peers", "public trackers"]

[requires]
bins = ["uqbit"]

# ---- reads

# Every setting with its value and default, from ~/.config/uqbit/config.json.
[[command]]
id = "config"
argv = ["/usr/bin/uqbit", "config", "show", "--json"]
output = "json"
timeout_ms = 8000
watch = { files = ["~/.config/uqbit/config.json"] }

# Whether uQbit opens .torrent files and magnet links (mimeapps.list).
[[command]]
id = "default-status"
argv = ["/usr/bin/uqbit", "default", "status", "--json"]
output = "json"
timeout_ms = 8000
watch = { files = ["~/.config/mimeapps.list"] }

# Whether the engine (qbittorrent-nox) is installed and running.
[[command]]
id = "engine-status"
argv = ["/usr/bin/uqbit", "engine", "status", "--json"]
output = "json"
timeout_ms = 10000

# Speeds, counts, the VPN binding and the blocklist (the Privacy card).
[[command]]
id = "status"
argv = ["/usr/bin/uqbit", "status", "--json"]
output = "json"
timeout_ms = 10000

# The torrents, for the counts under the engine row.
[[command]]
id = "list"
argv = ["/usr/bin/uqbit", "list", "--json"]
output = "json"
timeout_ms = 10000

# ---- writes

[[command]]
id = "config-set"
argv = ["/usr/bin/uqbit", "config", "set"]
output = "text"
timeout_ms = 45000
args = [{ name = "key", pattern = "^(download_folder|ask_before_adding|start_added|notify_finished|keep_running|start_on_login|download_limit|upload_limit|seed_ratio|vpn_only|vpn_interface|encryption|anonymous_mode|blocklist|incomplete_folder|watch_folder|content_layout|incomplete_extension|preallocate|max_active_downloads|max_active_uploads|max_active_torrents|seed_time|when_seeded|launch_on_login|start_in_tray|close_to_tray|minimize_to_tray|tracker_lists|import_plugins)$" }, { name = "value", pattern = "^(true|false|[0-9]{1,7}|~?/[A-Za-z0-9 ._+@'()/-]{0,300}|require|prefer|allow|original|subfolder|no_subfolder|stop|remove|https://[A-Za-z0-9._~:/?#@!$&'()*+,;=%-]{1,500}( https://[A-Za-z0-9._~:/?#@!$&'()*+,;=%-]{1,500}){0,9}|[A-Za-z][A-Za-z0-9_.:@-]{0,14})$" }]

[[command]]
id = "config-reset"
argv = ["/usr/bin/uqbit", "config", "reset"]
output = "text"
timeout_ms = 45000
args = [{ name = "key", pattern = "^(download_folder|ask_before_adding|start_added|notify_finished|keep_running|start_on_login|download_limit|upload_limit|seed_ratio|vpn_only|vpn_interface|encryption|anonymous_mode|blocklist|incomplete_folder|watch_folder|content_layout|incomplete_extension|preallocate|max_active_downloads|max_active_uploads|max_active_torrents|seed_time|when_seeded|launch_on_login|start_in_tray|close_to_tray|minimize_to_tray|tracker_lists|import_plugins)$" }]

# Sets uQbit for application/x-bittorrent and magnet: links in ~/.config/mimeapps.list.
[[command]]
id = "default-set"
argv = ["/usr/bin/uqbit", "--json", "default", "set"]
output = "json"
timeout_ms = 8000
confirm = "Open .torrent files and magnet links with uQbit from now on?"

[[command]]
id = "engine-start"
argv = ["/usr/bin/uqbit", "--json", "engine", "start"]
output = "json"
timeout_ms = 30000

[[command]]
id = "engine-stop"
argv = ["/usr/bin/uqbit", "--json", "engine", "stop"]
output = "json"
timeout_ms = 30000
confirm = "Stop the torrent engine? Downloads and seeding pause until it starts again."

# Downloads the tracker lists now (they refresh by themselves every day).
[[command]]
id = "trackers-update"
argv = ["/usr/bin/uqbit", "--json", "trackers", "update"]
output = "json"
timeout_ms = 100000

# Downloads the peer blocklist now (it refreshes by itself every week).
[[command]]
id = "blocklist-update"
argv = ["/usr/bin/uqbit", "--json", "blocklist", "update"]
output = "json"
timeout_ms = 150000
