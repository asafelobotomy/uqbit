# uQbit's tile in uQ's quick settings: the torrent speeds, and a switch that pauses or resumes
# every torrent. Shown while the torrent engine runs. Installed to
# /usr/share/uq/shell/widgets/uqbit-quick/ by uQbit's package; inert without uQ.
# Reference: docs/integrating.md ("Widgets") in the uQ repository.
uq_api = 1
id = "uqbit-quick"
name = "Torrents"
slot = "quick"
qml = "Widget.qml"
order = 55

[requires]
bins = ["uqbit"]

[[command]]
id = "status"
argv = ["/usr/bin/uqbit", "status", "--json"]
output = "json"
timeout_ms = 5000

[[command]]
id = "pause-all"
argv = ["/usr/bin/uqbit", "pause-all"]
output = "text"
timeout_ms = 8000

[[command]]
id = "resume-all"
argv = ["/usr/bin/uqbit", "resume-all"]
output = "text"
timeout_ms = 8000

[[command]]
id = "show"
argv = ["/usr/bin/uqbit", "show"]
output = "none"
timeout_ms = 4000
