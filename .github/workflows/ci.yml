name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  # Pure JavaScript: the window's helpers and the uQ Settings page's logic and manifest.
  logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node --test 'tests/**/*.test.mjs'

  # Qt 6.5+ on Arch, its target distribution: the core tests, the uQ page against the stub
  # Settings module, then the real window driving a real qbittorrent-nox under Xvfb.
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install Qt 6, qbittorrent-nox and the test tools
        run: |
          pacman -Syu --noconfirm --needed base-devel git cmake ninja qt6-base qt6-declarative \
            qt6-svg qt6-tools qbittorrent-nox xorg-server-xvfb xorg-xauth dbus python \
            imagemagick ttf-dejavu
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build (warnings are errors)
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-Wall -Wextra -Werror"
          cmake --build build
      - run: ctest --test-dir build --output-on-failure
      # the vendored uq-theme (uQ's native/uq-theme) is exactly the pinned release
      - run: scripts/check-uq-theme.sh 1.0.0 src/uqtheme.h src/uqtheme.cpp
      - name: uQ Settings page
        run: QT_QPA_PLATFORM=offscreen /usr/lib/qt6/bin/qmltestrunner -import tests/uq/stub -input tests/uq/tst_page.qml
      # qbittorrent-nox won't run as root without a warning prompt, so the smoke test runs as a
      # plain user.
      - name: The window drives a real engine
        run: |
          useradd -m tester
          chown -R tester .
          su tester -c "LANG=C.UTF-8 sh tests/gui/smoke.sh build shots"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: smoke-shots
          path: shots/
          if-no-files-found: ignore
